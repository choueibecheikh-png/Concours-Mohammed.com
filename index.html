<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concours Mohammed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f3f6fb;color:#102a43;font-family:Arial,sans-serif}header{background:#155eef;color:white;padding:18px;text-align:center}main{max-width:760px;margin:auto;padding:14px}.card{background:white;padding:18px;border-radius:15px;margin:15px 0;box-shadow:0 4px 18px #0001}.hidden{display:none}button,select{padding:12px;border:0;border-radius:9px;font-size:15px;font-weight:bold;margin:5px;cursor:pointer}button{background:#155eef;color:white}select{border:1px solid #ccd6e5;background:white;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid div{background:#edf4ff;padding:10px;border-radius:9px}.option{display:block;border:1px solid #ccd6e5;border-radius:10px;padding:12px;margin:9px 0;direction:ltr;text-align:left}.nav{display:flex;justify-content:space-between}.score{text-align:center;font-size:38px;color:#155eef;font-weight:bold}.review{border-top:1px solid #ddd;padding:12px 0;direction:ltr;text-align:left}.ok{color:#16803c}.bad{color:#c92a2a}#timer{color:#c92a2a;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<header><h1>منصة Concours Mohammed</h1><div>التحضير لمسابقة مفتشي الضرائب — موريتانيا</div></header>
<main>

<section class="card" id="home">
<h2>امتحان محاكاة</h2>
<p>60 سؤالًا بالفرنسية، المدة ساعة، والنتيجة من 20.</p>
<label><b>مستوى الصعوبة</b></label>
<select id="level">
<option value="medium">متوسط</option>
<option value="hard">صعب</option>
<option value="veryhard" selected>صعب جدًا</option>
</select>
<p>مستوى «صعب جدًا» هو المستوى الافتراضي.</p>
<div style="margin:16px 0;padding:14px;border:2px dashed #155eef;border-radius:12px;background:#f8fbff">
  <b>رفع مذكرات PDF</b>
  <input id="pdfFiles" type="file" accept="application/pdf" multiple style="display:block;width:100%;margin:12px 0">
  <button onclick="uploadPDFs()">رفع الملفات المختارة</button>
  <p id="uploadMessage"></p>
</div>
<button onclick="start()">ابدأ الامتحان</button>
</section>

<section class="card hidden" id="exam">
<div class="grid"><div id="number">1 / 60<br>السؤال</div><div id="timer">01:00:00<br>المتبقي</div><div id="answered">0<br>مجاب</div></div>
<div id="question"></div>
<div class="nav"><button onclick="previous()">السابق</button><button onclick="next()">التالي</button><button onclick="finish()">إرسال وتصحيح</button></div>
</section>

<section class="card hidden" id="result">
<h2>نتيجة الامتحان</h2>
<div id="grade" class="score"></div>
<p id="summary" style="text-align:center"></p>
<div id="reviews"></div>
<button onclick="start()">إعادة امتحان</button>
<button onclick="goHome()">العودة للرئيسية</button>
</section>

</main>
<script>
const supabase=window.supabase.createClient(
  "https://agqmifmzzbthskdhnsfh.supabase.co",
  "sb_publishable_PZFBrgRLTTlXzkWlC1oZYQ_lNBiDuop"
);

const bank=[
["Une entreprise comptabilise une charge sans pièce justificative. Quel est le risque fiscal le plus direct ?",["Rejet de la charge","Exonération automatique","Crédit de TVA","Prescription immédiate"],0],
["Une société omet volontairement une vente encaissée. Cette opération est principalement :",["Une erreur sans effet","Une dissimulation de recettes","Une exonération","Un amortissement"],1],
["Pour être déductible, une charge doit notamment être :",["Justifiée et engagée dans l'intérêt de l'entreprise","Toujours payée en espèces","Approuvée par un client","Supérieure à un seuil fixe"],0],
["Une entreprise a 90 000 UM de TVA collectée et 50 000 UM de TVA déductible. TVA nette :",["40 000 UM","50 000 UM","90 000 UM","140 000 UM"],0],
["Une procédure contradictoire permet surtout au contribuable :",["De présenter ses observations","D'annuler tout contrôle","De choisir son taux","De ne plus déclarer"],0],
["La prescription fiscale désigne :",["Un délai légal d'action","Une autorisation de fraude","Un remboursement","Une facture"],0],
["Le principe de légalité de l'impôt signifie que :",["L'impôt est fondé sur la loi","Chaque agent crée un impôt","Le contribuable fixe le taux","Les sanctions n'ont pas de règle"],0],
["Un crédit de TVA apparaît lorsque :",["TVA déductible > TVA collectée","TVA collectée > TVA déductible","Aucune vente existe","Aucun livre comptable"],0],
["Une facture fictive utilisée pour déduire une charge peut entraîner :",["Réintégration et sanction","Exonération","Remboursement","Prescription"],0],
["Le contrôle sur pièces consiste surtout à :",["Examiner déclarations et documents","Visiter toujours les locaux","Créer le budget","Émettre de la monnaie"],0],
["Une amende fiscale incluse dans une charge comptable est généralement :",["Non déductible","Toujours déductible","Une recette","Une TVA"],0],
["Les droits de douane peuvent notamment :",["Produire une recette et réguler les échanges","Supprimer les frontières","Remplacer tous les impôts","Garantir un bénéfice"],0]
];
let qs=[],answers=[],pos=0,seconds=3600,clock;

function start(){
 let level=document.getElementById("level").value;
 let pool=level==="veryhard"?bank.slice(0,10):level==="hard"?bank.slice(0,11):bank;
 qs=Array.from({length:60},(_,i)=>pool[i%pool.length]);
 answers=Array(60).fill(null);pos=0;seconds=3600;
 home.classList.add("hidden");result.classList.add("hidden");exam.classList.remove("hidden");
 render();clearInterval(clock);clock=setInterval(tick,1000);
}
function render(){
 let x=qs[pos];
 number.innerHTML=`${pos+1} / 60<br>السؤال`;
 answered.innerHTML=`${answers.filter(x=>x!==null).length}<br>مجاب`;
 question.innerHTML=`<h3 style="direction:ltr;text-align:left">${pos+1}. ${x[0]}</h3>`+x[1].map((a,i)=>`<label class="option"><input type="radio" name="a" value="${i}" ${answers[pos]===i?"checked":""}> ${"ABCD"[i]}) ${a}</label>`).join("");
 document.querySelectorAll('input[name=a]').forEach(e=>e.onchange=()=>{answers[pos]=+e.value;answered.innerHTML=`${answers.filter(x=>x!==null).length}<br>مجاب`});
}
function next(){if(pos<59){pos++;render()}}
function previous(){if(pos>0){pos--;render()}}
function tick(){seconds--;let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;timer.innerHTML=`${[h,m,s].map(x=>String(x).padStart(2,"0")).join(":")}<br>المتبقي`;if(seconds<=0)finish()}
function finish(){
 clearInterval(clock);let correct=0,html="";
 qs.forEach((x,i)=>{let ok=answers[i]===x[2];if(ok)correct++;html+=`<div class="review"><b>${i+1}. ${x[0]}</b><br><span class="${ok?"ok":"bad"}">${ok?"Correct":"Incorrect"} — Réponse: ${"ABCD"[x[2]]}) ${x[1][x[2]]}</span></div>`});
 exam.classList.add("hidden");result.classList.remove("hidden");
 grade.textContent=(correct/60*20).toFixed(2)+" / 20";
 summary.textContent=`${correct} réponses correctes sur 60`;
 reviews.innerHTML=html;
}
function goHome(){clearInterval(clock);exam.classList.add("hidden");result.classList.add("hidden");home.classList.remove("hidden");window.scrollTo(0,0)}
async function uploadPDFs(){
  const input=document.getElementById("pdfFiles");
  const message=document.getElementById("uploadMessage");
  const files=[...input.files];

  if(!files.length){
    message.textContent="اختر ملف PDF واحدًا على الأقل.";
    return;
  }

  message.textContent="جارٍ رفع الملفات...";

  let success=0;
  let errors=[];

  for(const file of files){
    const name=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path="memo-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+name;

    const {error}=await supabase.storage
      .from("references")
      .upload(path,file,{contentType:"application/pdf"});

    if(error) errors.push(file.name+": "+error.message);
    else success++;
  }

  input.value="";
  message.textContent=errors.length
    ? "تم رفع "+success+" ملف. خطأ: "+errors.join(" | ")
    : "تم رفع "+success+" ملف/ملفات بنجاح.";
}
</script>
</body>
</html>
