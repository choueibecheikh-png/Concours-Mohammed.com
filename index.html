<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concours Mohammed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      color: #162033;
    }

    .container {
      max-width: 720px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
    }

    .timer {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #b91c1c;
      padding: 12px;
      background: #fff1f2;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .question {
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .question:last-child {
      border-bottom: none;
    }

    .question p {
      font-weight: bold;
      margin-top: 0;
    }

    label {
      display: block;
      padding: 10px;
      margin: 7px 0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #166534;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      background: #94a3b8;
    }

    .score {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #166534;
      margin: 12px 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      margin: 18px 0;
    }

    .stat {
      padding: 12px 6px;
      border-radius: 9px;
      font-weight: bold;
    }

    .correct-stat {
      background: #dcfce7;
      color: #166534;
    }

    .wrong-stat {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty-stat {
      background: #fef3c7;
      color: #92400e;
    }

    .correction {
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border-right: 5px solid;
    }

    .correct {
      background: #ecfdf5;
      border-color: #16a34a;
    }

    .wrong {
      background: #fef2f2;
      border-color: #dc2626;
    }

    .unanswered {
      background: #fffbeb;
      border-color: #d97706;
    }

    .answer-line {
      margin: 7px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Concours Mohammed</h1>
      <p class="subtitle">منصة للتحضير للمسابقات والامتحانات</p>

      <div id="start-screen">
        <button id="start-btn">ابدأ الامتحان</button>
      </div>

      <div id="exam-screen" class="hidden">
        <div class="timer" id="timer">01:00:00</div>

        <div class="question">
          <p>1. ما هي عاصمة موريتانيا؟</p>
          <label><input type="radio" name="q1" value="a"> أ) نواذيبو</label>
          <label><input type="radio" name="q1" value="b"> ب) نواكشوط</label>
          <label><input type="radio" name="q1" value="c"> ج) كيفة</label>
          <label><input type="radio" name="q1" value="d"> د) أطار</label>
        </div>

        <div class="question">
          <p>2. كم يساوي 7 × 8؟</p>
          <label><input type="radio" name="q2" value="a"> أ) 54</label>
          <label><input type="radio" name="q2" value="b"> ب) 56</label>
          <label><input type="radio" name="q2" value="c"> ج) 64</label>
          <label><input type="radio" name="q2" value="d"> د) 48</label>
        </div>

        <button id="submit-btn">إرسال الإجابات والتصحيح</button>
      </div>
    </section>

    <section id="result-screen" class="card hidden">
      <h2>نتيجة الامتحان</h2>

      <div class="score" id="average"></div>

      <div class="stats">
        <div class="stat correct-stat">
          صحيحة<br>
          <span id="correct-count">0</span>
        </div>

        <div class="stat wrong-stat">
          خاطئة<br>
          <span id="wrong-count">0</span>
        </div>

        <div class="stat empty-stat">
          غير مجابة<br>
          <span id="empty-count">0</span>
        </div>
      </div>

      <h2>تفاصيل التصحيح</h2>
      <div id="corrections"></div>

      <button id="restart-btn">إعادة الامتحان</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        id: 'q1',
        text: 'ما هي عاصمة موريتانيا؟',
        answers: {
          a: 'نواذيبو',
          b: 'نواكشوط',
          c: 'كيفة',
          d: 'أطار'
        },
        correct: 'b',
        explanation: 'نواكشوط هي عاصمة الجمهورية الإسلامية الموريتانية.'
      },
      {
        id: 'q2',
        text: 'كم يساوي 7 × 8؟',
        answers: {
          a: '54',
          b: '56',
          c: '64',
          d: '48'
        },
        correct: 'b',
        explanation: 'حاصل ضرب 7 في 8 يساوي 56.'
      }
    ];

    const startBtn = document.getElementById('start-btn');
    const submitBtn = document.getElementById('submit-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startScreen = document.getElementById('start-screen');
    const examScreen = document.getElementById('exam-screen');
    const resultScreen = document.getElementById('result-screen');
    const timerEl = document.getElementById('timer');

    let timeLeft = 3600;
    let timerId = null;
    let submitted = false;

    startBtn.addEventListener('click', startExam);
    submitBtn.addEventListener('click', submitExam);
    restartBtn.addEventListener('click', () => location.reload());

    function startExam() {
      startScreen.classList.add('hidden');
      examScreen.classList.remove('hidden');
      startTimer();
    }

    function startTimer() {
      timerId = setInterval(() => {
        timeLeft--;

        const hours = Math.floor(timeLeft / 3600);
        const minutes = Math.floor((timeLeft % 3600) / 60);
        const seconds = timeLeft % 60;

        timerEl.textContent =
          String(hours).padStart(2, '0') + ':' +
          String(minutes).padStart(2, '0') + ':' +
          String(seconds).padStart(2, '0');

        if (timeLeft <= 0) {
          submitExam();
        }
      }, 1000);
    }

    function submitExam() {
      if (submitted) return;

      submitted = true;
      clearInterval(timerId);
      submitBtn.disabled = true;

      let correctCount = 0;
      let wrongCount = 0;
      let emptyCount = 0;
      let correctionHtml = '';

      questions.forEach((question, index) => {
        const selected = document.querySelector(
          'input[name="' + question.id + '"]:checked'
        );

        const selectedValue = selected ? selected.value : null;
        const correctValue = question.correct;

        let statusClass;
        let statusText;
        let userAnswer;

        if (!selectedValue) {
          emptyCount++;
          statusClass = 'unanswered';
          statusText = 'لم تتم الإجابة';
          userAnswer = 'لا توجد إجابة';
        } else if (selectedValue === correctValue) {
          correctCount++;
          statusClass = 'correct';
          statusText = 'إجابة صحيحة';
          userAnswer = question.answers[selectedValue];
        } else {
          wrongCount++;
          statusClass = 'wrong';
          statusText = 'إجابة خاطئة';
          userAnswer = question.answers[selectedValue];
        }

        correctionHtml += `
          <div class="correction ${statusClass}">
            <strong>السؤال ${index + 1}: ${statusText}</strong>
            <div class="answer-line">السؤال: ${question.text}</div>
            <div class="answer-line">إجابتك: ${userAnswer}</div>
            <div class="answer-line">الإجابة الصحيحة: ${question.answers[correctValue]}</div>
            <div class="answer-line">التفسير: ${question.explanation}</div>
          </div>
        `;
      });

      const total = questions.length;
      const averageOutOf20 = (correctCount / total) * 20;

      document.getElementById('average').textContent =
        'المعدل: ' + averageOutOf20.toFixed(2) + ' / 20';

      document.getElementById('correct-count').textContent = correctCount;
      document.getElementById('wrong-count').textContent = wrongCount;
      document.getElementById('empty-count').textContent = emptyCount;
      document.getElementById('corrections').innerHTML = correctionHtml;

      examScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
