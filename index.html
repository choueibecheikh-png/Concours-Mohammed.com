<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concours Mohammed</title>
<style>
body{margin:0;background:#f3f6fb;color:#102a43;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#063a89,#155eef);color:#fff;padding:18px;text-align:center}
main{max-width:780px;margin:auto;padding:14px}
.card{background:#fff;padding:18px;border-radius:15px;margin:15px 0;box-shadow:0 4px 18px #0001}
.hidden{display:none!important}
button,select{padding:12px;border:0;border-radius:9px;font-size:15px;font-weight:bold;margin:5px;cursor:pointer}
button{background:#155eef;color:#fff}
button.green{background:#16803c}
select{border:1px solid #ccd6e5;background:#fff;width:100%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid div{background:#edf4ff;padding:10px;border-radius:9px}
.option{display:block;border:1px solid #ccd6e5;border-radius:10px;padding:12px;margin:9px 0;direction:ltr;text-align:left}
.nav{display:flex;justify-content:space-between;gap:5px}
.score{text-align:center;font-size:38px;color:#155eef;font-weight:bold}
.review{border-top:1px solid #ddd;padding:12px 0;direction:ltr;text-align:left}
.ok{color:#16803c}.bad{color:#c92a2a}
#timer{color:#c92a2a;font-size:22px;font-weight:bold}
.notice{background:#fff5d9;color:#7a5700;padding:10px;border-radius:9px}
</style>
</head>
<body>
<header>
  <h1>منصة Concours Mohammed</h1>
  <div>التحضير لمسابقة مفتشي الضرائب — موريتانيا</div>
</header>

<main>
  <section class="card" id="home">
    <h2>امتحان محاكاة</h2>
    <p>60 سؤالًا بالفرنسية، المدة ساعة، والنتيجة من 20.</p>

    <label><b>مستوى الصعوبة</b></label>
    <select id="level">
      <option value="medium">متوسط</option>
      <option value="hard">صعب</option>
      <option value="veryhard" selected>صعب جدًا</option>
    </select>

    <p class="notice">سيبدأ الموقع الآن دون رفع ملفات حتى لا يتعطل. سنضيف مربع رفع المذكرات في الجزء الثالث بعد تثبيت الامتحان.</p>
    <button class="green" onclick="startExam()">ابدأ الامتحان</button>
  </section>

  <section class="card hidden" id="exam">
    <div class="grid">
      <div id="number">1 / 60<br>السؤال</div>
      <div id="timer">01:00:00<br>المتبقي</div>
      <div id="answered">0<br>مجاب</div>
    </div>
    <div id="question"></div>
    <div class="nav">
      <button onclick="previousQuestion()">السابق</button>
      <button onclick="nextQuestion()">التالي</button>
      <button class="green" onclick="finishExam()">إرسال وتصحيح</button>
    </div>
  </section>

  <section class="card hidden" id="result">
    <h2>نتيجة الامتحان</h2>
    <div id="grade" class="score"></div>
    <p id="summary" style="text-align:center"></p>
    <div id="reviews"></div>
    <button class="green" onclick="startExam()">إعادة امتحان</button>
    <button onclick="goHome()">العودة للرئيسية</button>
  </section>
</main>

<script>
const questions=[
["Une entreprise comptabilise une charge sans pièce justificative. Quel est le risque fiscal le plus direct ?",["Rejet de la charge","Exonération automatique","Crédit de TVA","Prescription immédiate"],0],
["Une société omet volontairement une vente encaissée. Cette opération est principalement :",["Une erreur sans effet","Une dissimulation de recettes","Une exonération","Un amortissement"],1],
["Pour être déductible, une charge doit notamment être :",["Justifiée et engagée dans l'intérêt de l'entreprise","Toujours payée en espèces","Approuvée par un client","Supérieure à un seuil fixe"],0],
["Une entreprise a 90 000 UM de TVA collectée et 50 000 UM de TVA déductible. TVA nette :",["40 000 UM","50 000 UM","90 000 UM","140 000 UM"],0],
["Une procédure contradictoire permet surtout au contribuable :",["De présenter ses observations","D'annuler tout contrôle","De choisir son taux","De ne plus déclarer"],0],
["La prescription fiscale désigne :",["Un délai légal d'action","Une autorisation de fraude","Un remboursement","Une facture"],0],
["Le principe de légalité de l'impôt signifie que :",["L'impôt est fondé sur la loi","Chaque agent crée un impôt","Le contribuable fixe le taux","Les sanctions n'ont pas de règle"],0],
["Un crédit de TVA apparaît lorsque :",["TVA déductible > TVA collectée","TVA collectée > TVA déductible","Aucune vente existe","Aucun livre comptable"],0],
["Une facture fictive utilisée pour déduire une charge peut entraîner :",["Réintégration et sanction","Exonération","Remboursement","Prescription"],0],
["Le contrôle sur pièces consiste surtout à :",["Examiner déclarations et documents","Visiter toujours les locaux","Créer le budget","Émettre de la monnaie"],0],
["Une amende fiscale incluse dans une charge comptable est généralement :",["Non déductible","Toujours déductible","Une recette","Une TVA"],0],
["Les droits de douane peuvent notamment :",["Produire une recette et réguler les échanges","Supprimer les frontières","Remplacer tous les impôts","Garantir un bénéfice"],0]
];

let examQuestions=[],answers=[],position=0,seconds=3600,timerId=null;

function startExam(){
  const level=document.getElementById("level").value;
  let pool=level==="veryhard"?questions.slice(0,10):level==="hard"?questions.slice(0,11):questions;
  examQuestions=Array.from({length:60},(_,i)=>pool[i%pool.length]);
  answers=Array(60).fill(null);
  position=0;
  seconds=3600;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("exam").classList.remove("hidden");

  renderQuestion();
  clearInterval(timerId);
  updateTimer();
  timerId=setInterval(updateTimer,1000);
}

function renderQuestion(){
  const item=examQuestions[position];

  document.getElementById("number").innerHTML=`${position+1} / 60<br>السؤال`;
  document.getElementById("answered").innerHTML=`${answers.filter(x=>x!==null).length}<br>مجاب`;

  document.getElementById("question").innerHTML=
    `<h3 style="direction:ltr;text-align:left">${position+1}. ${item[0]}</h3>`+
    item[1].map((choice,index)=>
      `<label class="option">
        <input type="radio" name="answer" value="${index}" ${answers[position]===index?"checked":""}>
        ${"ABCD"[index]}) ${choice}
      </label>`
    ).join("");

  document.querySelectorAll('input[name="answer"]').forEach(input=>{
    input.onchange=()=>{
      answers[position]=Number(input.value);
      document.getElementById("answered").innerHTML=`${answers.filter(x=>x!==null).length}<br>مجاب`;
    };
  });
}

function nextQuestion(){
  if(position<59){position++;renderQuestion();}
}

function previousQuestion(){
  if(position>0){position--;renderQuestion();}
}

function updateTimer(){
  seconds--;
  const h=Math.floor(seconds/3600);
  const m=Math.floor(seconds%3600/60);
  const s=seconds%60;

  document.getElementById("timer").innerHTML=
    `${[h,m,s].map(x=>String(x).padStart(2,"0")).join(":")}<br>المتبقي`;

  if(seconds<=0)finishExam();
}

function finishExam(){
  clearInterval(timerId);

  let correct=0;
  let details="";

  examQuestions.forEach((item,index)=>{
    const ok=answers[index]===item[2];
    if(ok)correct++;

    details+=`
      <div class="review">
        <b>${index+1}. ${item[0]}</b><br>
        <span class="${ok?"ok":"bad"}">
          ${ok?"Correct":"Incorrect"} — Réponse: ${"ABCD"[item[2]]}) ${item[1][item[2]]}
        </span>
      </div>
    `;
  });

  document.getElementById("exam").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("grade").textContent=`${(correct/60*20).toFixed(2)} / 20`;
  document.getElementById("summary").textContent=`${correct} réponses correctes sur 60`;
  document.getElementById("reviews").innerHTML=details;
}

function goHome(){
  clearInterval(timerId);
  document.getElementById("exam").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  window.scrollTo(0,0);
}
</script>
</body>
</html>
