<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concours Mohammed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      color: #162033;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 22px;
    }

    .hero {
      margin-top: 45px;
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    h1 {
      color: #166534;
      margin: 0 0 12px;
      font-size: 30px;
    }

    p {
      color: #475569;
      line-height: 1.8;
    }

    .button {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border-radius: 10px;
      background: #166534;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .features {
      margin-top: 18px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }

    .features h2 {
      font-size: 20px;
      margin-top: 0;
    }

    .features ul {
      margin: 0;
      padding-right: 20px;
      line-height: 2;
      color: #475569;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Concours Mohammed</h1>
      <p>منصة رقمية للتحضير للمسابقات والامتحانات، مع اختبارات وتصحيح فوري ونتائج مفصلة.</p>

      <a class="button" href="index.html">ابدأ الامتحان التجريبي</a>
    </section>

    <section class="features">
      <h2>ماذا ستجد في المنصة؟</h2>
      <ul>
        <li>اختبارات في مجالات متعددة</li>
        <li>مؤقت للامتحان</li>
        <li>معدل من 20 بعد التصحيح</li>
        <li>تفاصيل الإجابات الصحيحة والخاطئة</li>
      </ul>
    </section>
  </main>
</body>
</html>
